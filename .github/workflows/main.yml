name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install requirements
      run: |
        sudo apt update
        sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \
          default-jdk gnupg flex bison gperf build-essential zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev \
          make bc grep tofrodos python3-markdown libxml2-utils xsltproc libtinfo6 cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools zstd \
          --fix-missing
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

    - name: Setup toolchains
      run: |
        export WORKDIR="${GITHUB_WORKSPACE}"
        mkdir -p "${WORKDIR}/toolchains"
        
        # Clang
        if [ ! -d "${WORKDIR}/toolchains/clang-r353983c" ]; then
          mkdir -p "${WORKDIR}/toolchains/clang-r353983c"
          cd "${WORKDIR}/toolchains/clang-r353983c"
          curl -LO "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r353983c.tar.gz"
          tar -xf clang-r353983c.tar.gz && rm clang-r353983c.tar.gz
        fi

        # GCC
        if [ ! -d "${WORKDIR}/toolchains/gcc" ]; then
          mkdir -p "${WORKDIR}/toolchains/gcc"
          cd "${WORKDIR}/toolchains/gcc"
          curl -LO "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        fi

    - name: Build Kernel
      run: |
        export KERNEL_ROOT="${GITHUB_WORKSPACE}"
        export ARCH=arm64
        export KBUILD_BUILD_USER="@juneed"
        export PATH="${KERNEL_ROOT}/toolchains/clang-r353983c/bin:$PATH"
        export LD_LIBRARY_PATH="${KERNEL_ROOT}/toolchains/clang-r353983c/lib64"
        export CROSS_COMPILE="${KERNEL_ROOT}/toolchains/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-"
        export CC="${KERNEL_ROOT}/toolchains/clang-r353983c/bin/clang"
        export CLANG_TRIPLE="aarch64-linux-gnu-"

        mkdir -p "${KERNEL_ROOT}/out" "${KERNEL_ROOT}/build"

        make -C "$KERNEL_ROOT" O="${KERNEL_ROOT}/out" ARCH=arm64 CROSS_COMPILE="${CROSS_COMPILE}" CC="${CC}" CLANG_TRIPLE="${CLANG_TRIPLE}" lineage_tiffany_defconfig
        make -C "$KERNEL_ROOT" O="${KERNEL_ROOT}/out" ARCH=arm64 CROSS_COMPILE="${CROSS_COMPILE}" CC="${CC}" CLANG_TRIPLE="${CLANG_TRIPLE}" -j$(nproc) Image

        cp "${KERNEL_ROOT}/out/arch/arm64/boot/Image" "${KERNEL_ROOT}/build/"

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: build/Image
