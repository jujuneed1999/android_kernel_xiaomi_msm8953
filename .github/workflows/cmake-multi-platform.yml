name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup build environment
      run: |
        sudo apt update
        sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \
          default-jdk git gnupg flex bison gperf build-essential zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev \
          python3 make sudo gcc g++ bc grep tofrodos python3-markdown libxml2-utils xsltproc zlib1g-dev python-is-python3 libc6-dev libtinfo6 \
          make repo cpio kmod openssl libelf-dev pahole libssl-dev libarchive-tools zstd binutils --fix-missing
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

    - name: Prepare toolchains
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        curl -LO https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r353983c.tar.gz
        tar -xf clang-r353983c.tar.gz && rm clang-r353983c.tar.gz

        curl -LO https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
        tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz

    - name: Build kernel
      run: |
        export KERNEL_ROOT=$(pwd)
        export ARCH=arm64
        export KBUILD_BUILD_USER="@ravindu644"
        export PATH=$PATH:$HOME/toolchains/clang-r353983c/bin
        export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HOME/toolchains/clang-r353983c/lib64
        export BUILD_CROSS_COMPILE=$HOME/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-
        export BUILD_CC=$HOME/toolchains/clang-r353983c/bin/clang

        mkdir -p $KERNEL_ROOT/out $KERNEL_ROOT/build

        make -C $KERNEL_ROOT O=$KERNEL_ROOT/out ARCH=arm64 CROSS_COMPILE=$BUILD_CROSS_COMPILE CC=$BUILD_CC CLANG_TRIPLE=aarch64-linux-gnu- tiffany_defconfig
        make -C $KERNEL_ROOT O=$KERNEL_ROOT/out ARCH=arm64 CROSS_COMPILE=$BUILD_CROSS_COMPILE CC=$BUILD_CC CLANG_TRIPLE=aarch64-linux-gnu- Image

        cp $KERNEL_ROOT/out/arch/arm64/boot/Image $KERNEL_ROOT/build/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: build/Image
