name: Build Kernel for Tiffany (Mi 5X)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev \
          crossbuild-essential-arm64 gcc-aarch64-linux-gnu binutils git wget
          
    - name: Set Environment Variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Ensure Environment Path
      run: |
        echo "/usr/bin" >> $GITHUB_PATH

    - name: Configure Kernel (tiffany_defconfig)
      run: |
        make O=out tiffany_defconfig

    - name: Build Kernel
      run: |
        make -j$(nproc) O=out

    - name: Collect Output
      run: |
        mkdir -p output
        cp out/arch/arm64/boot/Image.gz-dtb output/ || echo "Image.gz-dtb not found"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiffany-kernel
        path: output/
